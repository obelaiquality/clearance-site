<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Clearance — coming soon</title>
<style>
  :root { --paper:#EDE6D6; --charcoal:#1E1C1A; --brass:#B8893E; }
  html,body { margin:0; height:100%; background:var(--charcoal); color:var(--paper);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height:100%; display:flex; flex-direction:column; justify-content:center;
    padding:0 16px; max-width:720px; margin:0 auto; }
  h1 { font-size:clamp(40px,9vw,88px); letter-spacing:.06em; margin:0; text-transform:uppercase; }
  hr { width:160px; border:0; border-top:3px solid var(--brass); margin:16px 0 24px; }
  p { opacity:.82; font-size:18px; line-height:1.5; margin:0; }
</style>
</head>
<body>
<main>
  <h1>Clearance</h1>
  <hr>
  <p>Clear the mess. Find the treasure. Coming 2027.</p>
</main>
</body>
</html>
